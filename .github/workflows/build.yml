name: Build tools

on:
  workflow_dispatch:
    inputs:
      tool:
        description: Tool to build
        type: choice
        options: [all, x265, svt-av1]
        default: all
      version:
        description: Upstream version override (single tool only; blank = latest tag)
        type: string
        default: ""
      force:
        description: Rebuild even if the release already exists
        type: boolean
        default: false
  schedule:
    # Weekly upstream tag check, Mondays 04:17 UTC. Only missing releases are built.
    - cron: "17 4 * * 1"

permissions:
  contents: write

concurrency:
  group: build-tools
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TOOL: ${{ inputs.tool || 'all' }}
          INPUT_VERSION: ${{ inputs.version || '' }}
          INPUT_FORCE: ${{ inputs.force || false }}
        run: python3 scripts/plan.py

  build:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: ${{ matrix.tool }} ${{ matrix.version }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git zip
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            nasm:p

      - name: Build
        run: bash scripts/build-${{ matrix.tool }}.sh "${{ matrix.git }}" "${{ matrix.ref }}" "out/${{ matrix.tool }}"

      - name: Check the exe has no MSYS2 DLL dependencies
        run: |
          exe=$(ls out/${{ matrix.tool }}/*.exe)
          ldd "$exe"
          if ldd "$exe" | grep -i "/ucrt64/"; then
            echo "::error::$exe depends on MSYS2 DLLs; it must be fully static"; exit 1
          fi

      - name: Package
        id: package
        run: |
          set -euo pipefail
          name="${{ matrix.tool }}-${{ matrix.version }}-win64"
          dir="out/${{ matrix.tool }}"
          {
            echo "tool: ${{ matrix.tool }}"
            echo "upstream_version: ${{ matrix.version }}"
            echo "upstream_ref: ${{ matrix.ref }}"
            echo "upstream_git: ${{ matrix.git }}"
            echo "upstream_commit: $(git -C work-${{ matrix.tool }}/src rev-parse HEAD)"
            echo "compiler: $(gcc --version | head -1)"
            echo "toolchain: MSYS2 UCRT64, static link"
            echo "built_by: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "built_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$dir/BUILDINFO.txt"
          mkdir -p dist
          (cd "$dir" && zip -9 -r "../../dist/$name.zip" .)
          (cd dist && sha256sum "$name.zip" > checksums.sha256 && cat checksums.sha256)

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(cut -d' ' -f1 dist/checksums.sha256)
          cat > notes.md <<NOTES
          Windows x64 build of **${{ matrix.tool }} ${{ matrix.version }}** from the upstream tag \`${{ matrix.ref }}\`, built unmodified with MSYS2 UCRT64 (static).

          - Upstream changelog: ${{ matrix.notes_url }}
          - Upstream source: ${{ matrix.source_url }}
          - Build log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          SHA-256 (\`${{ matrix.tool }}-${{ matrix.version }}-win64.zip\`): \`$sha\`

          Consumed by the RenderForge Encoder Manager. See LICENSES.md in this repo for licence notes.
          NOTES
          if gh release view "${{ matrix.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ matrix.tag }}" dist/*.zip dist/checksums.sha256 --clobber
            gh release edit "${{ matrix.tag }}" --notes-file notes.md
          else
            gh release create "${{ matrix.tag }}" dist/*.zip dist/checksums.sha256 \
              --title "${{ matrix.tool }} ${{ matrix.version }} (Windows x64)" \
              --notes-file notes.md --latest=false
          fi
